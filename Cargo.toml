[package]
name = "univers-aip-lib-aui-rendering"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "In-process AUI text renderers and caller-composed history windows"
repository = "https://github.com/hsudatalks/univers-aip-libs-rs-aui-rendering"
publish = ["univers"]
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/**", "scripts/**", ".cargo/config.toml"]
[workspace]
members = ["."]
resolver = "2"
[dependencies]
chrono = "0.4"
serde_json = "1"
univers-aip-contracts-shared = { version = ">=1.0.0-rc.1, <1.0.0", registry = "univers", default-features = false, features = ["insight-types"] }
